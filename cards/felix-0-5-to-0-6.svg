<svg class="ck-svg" viewBox="0 0 480 400" aria-hidden="true" focusable="false"><g font-size="16"><text x="20" y="36" class="cap" font-size="16" text-anchor="start">TRUSTED  &gt;  CHANGED</text><g class="rough"><g transform="translate(412 4) scale(0.58)"><g transform="translate(0 -2)"><path class="cf" d="M20 52C19 38 24 29 31 24L27 6Q27 3 30 5L47 17Q50 16.5 53 17L70 5Q73 3 73 6L69 24C76 29 81 38 80 52C80 72 67 86 50 86C33 86 20 72 20 52Z"/><path class="ce" d="M32 21L30.5 11L41 18ZM68 21L69.5 11L59 18Z"/><path class="cw" d="M29 66C31 57 42 55 50 60C58 55 69 57 71 66C71 77 61 84 50 84C39 84 29 77 29 66Z"/><path class="cn" d="M45.5 60.5h9l-4.5 5z"/><path class="wh" d="M31 68L6 63M31 73L7 76M69 68L94 63M69 73L93 76"/><path class="hap" d="M31 45Q38 51 45 45M55 45Q62 51 69 45"/><path class="mo" d="M44 72Q50 75 56 72"/></g></g></g><g class="rough"><path class="bubble" d="M290 14h96a6 6 0 0 1 6 6v20a6 6 0 0 1-6 6h-96a6 6 0 0 1-6-6v-20a6 6 0 0 1 6-6z"/></g><text x="338" y="38" class="hand" font-size="18" text-anchor="middle">still true?</text><g class="chr"><rect x="12" y="72" width="196" height="42" rx="8"/></g><text x="110" y="99" font-size="16" text-anchor="middle">a storage id</text><path class="lnm" d="M214 93H240M231 87L240 93L231 99"/><g class="chx"><rect x="246" y="72" width="222" height="42" rx="8"/></g><text x="357" y="99" class="bad" font-size="16" text-anchor="middle">disk wiped, id kept</text><g class="chr"><rect x="12" y="126" width="196" height="42" rx="8"/></g><text x="110" y="153" font-size="16" text-anchor="middle">a stream name</text><path class="lnm" d="M214 147H240M231 141L240 147L231 153"/><g class="chx"><rect x="246" y="126" width="222" height="42" rx="8"/></g><text x="357" y="153" class="bad" font-size="16" text-anchor="middle">deleted, then recreated</text><g class="chr"><rect x="12" y="180" width="196" height="42" rx="8"/></g><text x="110" y="207" font-size="16" text-anchor="middle">a Raft member’s vote</text><path class="lnm" d="M214 201H240M231 195L240 201L231 207"/><g class="chx"><rect x="246" y="180" width="222" height="42" rx="8"/></g><text x="357" y="207" class="bad" font-size="16" text-anchor="middle">its volume was wiped</text><g class="chr"><rect x="12" y="234" width="196" height="42" rx="8"/></g><text x="110" y="261" font-size="16" text-anchor="middle">the fence’s majority</text><path class="lnm" d="M214 255H240M231 249L240 255L231 261"/><g class="chx"><rect x="246" y="234" width="222" height="42" rx="8"/></g><text x="357" y="261" class="bad" font-size="16" text-anchor="middle">counted the new set</text><g class="chr"><rect x="12" y="288" width="196" height="42" rx="8"/></g><text x="110" y="315" font-size="16" text-anchor="middle">a feed’s next_seq</text><path class="lnm" d="M214 309H240M231 303L240 309L231 315"/><g class="chx"><rect x="246" y="288" width="222" height="42" rx="8"/></g><text x="357" y="315" class="bad" font-size="16" text-anchor="middle">the page was cut short</text><g class="chr"><rect x="12" y="342" width="196" height="42" rx="8"/></g><text x="110" y="369" font-size="16" text-anchor="middle">a valid token</text><path class="lnm" d="M214 363H240M231 357L240 363L231 369"/><g class="chx"><rect x="246" y="342" width="222" height="42" rx="8"/></g><text x="357" y="369" class="bad" font-size="16" text-anchor="middle">its principal was revoked</text></g></svg>
