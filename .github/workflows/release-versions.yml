name: Release versions

# Keeps every version, release date and release link on index.html in step with
# the newest GetFelix releases. Which repos it follows comes from the markers on
# the page; see .github/scripts/release_versions.py.
#
# Marker-only updates land on main without a person: the ruleset requires a PR
# but no approval or checks, so the bot opens one and auto-merges it. Only stable
# releases are followed; previews are never put on the page.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  # A repo's release workflow can send this to update the page right away.
  repository_dispatch:
    types: [release-published]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-versions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set the bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # A missing release asset fails this step after the other repos are
      # updated; those still land, and the last step fails the run.
      - name: Update the page
        id: update
        continue-on-error: true
        run: python3 .github/scripts/release_versions.py | tee "$RUNNER_TEMP/changes.txt"

      - name: Land the update on main
        if: steps.update.outputs.changed == 'true'
        run: |
          branch="release-versions/auto"
          git switch -C "$branch"
          git commit -qam "Update release versions" -m "$(cat "$RUNNER_TEMP/changes.txt")"
          git push --force origin "$branch"
          if ! gh pr view "$branch" --json state --jq .state | grep -qx OPEN; then
            gh pr create --base main --head "$branch" \
              --title "Update release versions" \
              --body "$(printf 'Opened and merged by the release-versions workflow.\n\n```\n%s\n```' "$(cat "$RUNNER_TEMP/changes.txt")")"
          fi
          if gh pr merge "$branch" --auto --squash --delete-branch; then
            echo "Merge path: auto-merge"
          else
            # No required checks, so a direct merge lands the same commit.
            echo "Merge path: auto-merge failed, merging directly"
            gh pr merge "$branch" --squash --delete-branch
          fi

      # A merge made with the workflow token does not start the Pages workflow,
      # so deploy the merged page by hand once the PR has landed.
      - name: Deploy the merged page
        if: steps.update.outputs.changed == 'true'
        run: |
          for _ in $(seq 1 30); do
            [ "$(gh pr view release-versions/auto --json state --jq .state)" = MERGED ] && break
            sleep 10
          done
          if [ "$(gh pr view release-versions/auto --json state --jq .state)" != MERGED ]; then
            echo "::error::The release-versions PR did not merge within 5 minutes, so the page was not deployed. Merge it, then run the Pages workflow."
            exit 1
          fi
          gh workflow run pages.yml --ref main


      - name: Fail if the page could not be fully updated
        if: steps.update.outcome == 'failure'
        run: |
          echo "::error::The update step failed; its log says which repo was left on its old release and why."
          exit 1
