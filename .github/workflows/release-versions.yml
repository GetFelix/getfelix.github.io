name: Release versions

# Keeps every version, release date and release link on index.html in step with
# the newest GetFelix releases. Which repos it follows comes from the markers on
# the page; see .github/scripts/release_versions.py.
#
# Marker-only updates land on main without a person: the ruleset requires a PR
# but no approval or checks, so the bot opens one and merges it. A Felix release
# that moves between prerelease and stable gets a PR for a person instead,
# because the Get started install commands (--pre, @preview) need rewriting.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  # A repo's release workflow can send this to update the page right away.
  repository_dispatch:
    types: [release-published]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-versions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set the bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update the page
        id: update
        run: python3 .github/scripts/release_versions.py --hold-felix-channel | tee "$RUNNER_TEMP/changes.txt"

      - name: Land the update on main
        if: steps.update.outputs.changed == 'true'
        run: |
          branch="release-versions/auto"
          git switch -C "$branch"
          git commit -qam "Update release versions" -m "$(cat "$RUNNER_TEMP/changes.txt")"
          git push --force origin "$branch"
          if ! gh pr view "$branch" --json state --jq .state | grep -qx OPEN; then
            gh pr create --base main --head "$branch" \
              --title "Update release versions" \
              --body "$(printf 'Opened and merged by the release-versions workflow.\n\n```\n%s\n```' "$(cat "$RUNNER_TEMP/changes.txt")")"
          fi
          # Auto-merge needs the repo setting; with no required checks a direct
          # merge is the same thing.
          gh pr merge "$branch" --squash --delete-branch --auto \
            || gh pr merge "$branch" --squash --delete-branch

      - name: Open a PR for the Felix release channel change
        if: steps.update.outputs.held != ''
        env:
          TAG: ${{ steps.update.outputs.held }}
        run: |
          branch="release-versions/felix-$TAG"
          # A PR for this release is already open or was closed on purpose.
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "Branch $branch already exists."
            exit 0
          fi
          git fetch -q origin main
          git switch -C "$branch" origin/main
          python3 .github/scripts/release_versions.py
          git commit -qam "Point the page at Felix $TAG"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Point the page at Felix $TAG" \
            --body "Felix $TAG moves the page between a pre-release and a stable release, so this was left for a person.

          Before merging, update the Get started section: its install commands and the sentence above them are written for one channel (\`--pre\`, \`@preview\`)."
